<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Storm Lightning</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="panel">
      <h1>Storm Lightning</h1>
      <p class="muted">Атмосферные молнии поверх сцены. Эффект синхронизируется у всех игроков.</p>

      <label class="row">
        <span>Цвет</span>
        <input id="color" type="color" value="#e8f1ff" />
      </label>

      <label>
        <span>Яркость: <b id="intensityValue">0.75</b></span>
        <input id="intensity" type="range" min="0.15" max="1" value="0.75" step="0.05" />
      </label>

      <label>
        <span>Минимальная пауза, сек.</span>
        <input id="minDelay" type="number" min="1" max="120" value="7" />
      </label>

      <label>
        <span>Максимальная пауза, сек.</span>
        <input id="maxDelay" type="number" min="1" max="180" value="18" />
      </label>

      <label class="check"><input id="bolt" type="checkbox" checked /> Показывать сам разряд</label>
      <label class="check"><input id="doubleFlash" type="checkbox" checked /> Двойная вспышка</label>

      <div class="buttons">
        <button id="strike" class="secondary">⚡ Молния сейчас</button>
        <button id="start" class="primary">Запустить грозу</button>
        <button id="stop" class="danger">Остановить</button>
      </div>

      <div id="status" class="status">Подключение…</div>
      <p class="small">Управление доступно мастеру. Для работы нужен открытый Scene.</p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
